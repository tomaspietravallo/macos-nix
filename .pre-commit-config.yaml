fail_fast: true
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: update-flake-lock
        name: Update flake inputs
        entry: bash scripts/nix-hook.sh update
        language: system
        pass_filenames: false
        always_run: true
      - id: check-flake
        name: Check flake configuration
        entry: bash scripts/nix-hook.sh check
        language: system
        pass_filenames: false
        always_run: true
      - id: build-darwin
        name: Build Darwin configuration
        entry: bash scripts/nix-hook.sh build
        language: system
        pass_filenames: false
        always_run: true
      - id: switch-darwin
        name: Apply Darwin configuration
        entry: >-
          bash -c 'set -euo pipefail; while IFS= read -r git_env; do unset "$git_env"; done < <(git rev-parse --local-env-vars); exec sudo -H darwin-rebuild switch --flake ".?submodules=1#Tomass-MacBook-Pro" </dev/tty >/dev/tty 2>/dev/tty'
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true
