fail_fast: true

repos:
  - repo: local
    hooks:
      - id: update-flake-lock
        name: Update flake inputs
        entry: bash scripts/nix-hook.sh update
        language: system
        pass_filenames: false
        always_run: true
      - id: check-flake
        name: Check flake configuration
        entry: bash scripts/nix-hook.sh check
        language: system
        pass_filenames: false
        always_run: true
      - id: build-darwin
        name: Build Darwin configuration
        entry: bash scripts/nix-hook.sh build
        language: system
        pass_filenames: false
        always_run: true
